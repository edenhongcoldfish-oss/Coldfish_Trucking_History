# Render Blueprint: free-tier DEMO deployment (sample data only, no real data).
# Not for production: free instances sleep when idle and the demo data resets.
services:
  - type: web
    name: coldfish-trucking-demo
    runtime: node
    plan: free
    # The empty database is created during the build: creating it at start-up needs more than the 512 MB free plan
    buildCommand: npm ci --omit=dev && node src/prepare-db.js
    startCommand: node src/server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: DEMO_LOGIN
        value: "true"
      - key: SEED_DEMO
        value: "true"
      - key: TZ
        value: America/Vancouver
