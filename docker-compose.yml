# Run on the company NAS: docker compose up -d
# Services: db (PostgreSQL) + app (web app) + backup (daily automatic backup). Zero cost.
# The DB port is never exposed. The app listens on NAS-local port 3000 only; outside access goes through Tailscale Funnel (free HTTPS).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: trucking
      POSTGRES_USER: trucking
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-America/Vancouver}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trucking -d trucking"]
      interval: 10s
      retries: 10
    # no ports: the DB cannot be reached from outside the NAS

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://trucking:${POSTGRES_PASSWORD}@db:5432/trucking
      SEED_DEMO: ${SEED_DEMO:-false}
      DEMO_LOGIN: ${DEMO_LOGIN:-false}
      PUSH_CONTACT: ${PUSH_CONTACT:-}
      TRUST_PROXY: "loopback, uniquelocal"
      TZ: ${TZ:-America/Vancouver}
    ports:
      - "127.0.0.1:3000:3000"   # NAS-local only. Tailscale Funnel forwards here
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: trucking
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: trucking
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_AT: ${BACKUP_AT:-02:00}
      TZ: ${TZ:-America/Vancouver}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ./backup/nas-backup.sh:/nas-backup.sh:ro
    entrypoint: ["/bin/sh", "/nas-backup.sh"]
